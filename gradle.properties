# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.19.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.19.2,1.20)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=43.5.0
# The Forge version range can use any version of Forge as bounds.
forge_version_range=[43,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[43,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=hotbaaaar
# The human-readable display name for the mod.
mod_name=HotBaaaar
# The license of the mod.
mod_license=GNU GPL 3.0
# The mod version.
mod_version=1.19.2-1.0
# The group ID for the mod.
mod_group_id=cn.ussshenzhou
# The authors of the mod.
mod_authors=USS_Shenzhou
# The description of the mod.
mod_description=Super long hotbar, client-side only. Scroll past the edge to flip the active row into the real hotbar.
